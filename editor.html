<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spot It – Game-set editor</title>
  <style>
    :root{--ink:#1d1a1a;--accent:#f97316;--paper:#fff9f1;--line:#d7cfc4}*{box-sizing:border-box}body{margin:0;font:16px "Trebuchet MS",Segoe UI,sans-serif;color:var(--ink);background:#f8f3ea}.app{max-width:1100px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:270px 1fr;gap:18px}.panel,.question-card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 8px 24px #0001}.set-list{display:grid;gap:8px;margin:12px 0}.set-button{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}.set-button.active{border:2px solid var(--accent)}button{border:0;border-radius:999px;background:var(--accent);padding:9px 15px;font-weight:bold;cursor:pointer}button.ghost{background:transparent;border:1px solid var(--line)}button.danger{background:#b42318;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}label{display:grid;gap:5px;margin:10px 0}.question-card{margin:14px 0}.question-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.image-box{min-width:0}.stage{position:relative;aspect-ratio:1;background:#111;border-radius:10px;overflow:hidden;cursor:crosshair}.stage img{width:100%;height:100%;object-fit:contain;display:block}.circle{position:absolute;border:3px solid #e11d48;background:#e11d4822;border-radius:50%;transform:translate(-50%,-50%);cursor:grab;touch-action:none}.circle.crosshair::before,.circle.crosshair::after{content:"";position:absolute;background:#e11d48}.circle.crosshair::before{left:0;right:0;top:50%;height:2px}.circle.crosshair::after{top:0;bottom:0;left:50%;width:2px}.circle.hidden{display:none}.crop-stage{position:relative;overflow:hidden;border-radius:10px;background:#111;line-height:0}.crop-stage img{display:block;width:100%;height:auto}.crop-window{position:absolute;border:3px solid #f97316;box-shadow:0 0 0 9999px #0008;cursor:move;touch-action:none}.crop-handle{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:#f97316;border:2px solid white;cursor:nwse-resize}.hint,.status{color:#655e58;font-size:.9rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:760px){.layout,.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="app">
  <header><div><h1>Game-set editor</h1><p>Create complete Spot It rounds with question, reveal image, and solution area.</p></div><a href="/">Back to game</a></header>
  <div class="layout"><aside class="panel"><button id="new-set">New game-set</button><div id="set-list" class="set-list"></div></aside>
  <section class="panel"><div id="empty"><h2>Choose or create a game-set</h2><p>Saved sets appear on the left. A set needs at least one complete question before it can be saved.</p></div>
  <div id="editor" class="hidden"><label>Game-set name<input id="set-name" maxlength="100" placeholder="For example: Animals"></label><div id="questions"></div><div class="actions"><button id="add-question">Add question</button><button id="save-set">Save game-set</button><button id="duplicate-set" class="ghost">Duplicate</button><button id="delete-set" class="danger">Delete</button></div><p id="status" class="status"></p></div></section></div>
</main><script>
let sets=[], current=null;
const $=id=>document.getElementById(id), list=$("set-list"), editor=$("editor"), empty=$("empty"), questions=$("questions"), status=$("status");
const blankQuestion=()=>({question:"",default_type:"individual_blind",duration_seconds:60,image:"",reveal_image:"",solution:null,show_crosshair:false,use_same_image:false,apply_crop_to_reveal:false});
function message(text){status.textContent=text}
async function api(url,options={}){const r=await fetch(url,options);if(!r.ok){const b=await r.json().catch(()=>({}));throw Error(b.detail||"Request failed.")}return r.json()}
async function loadSets(){sets=await api("/api/game-sets");list.innerHTML="";sets.forEach(set=>{const b=document.createElement("button");b.className="set-button"+(current&&current.id===set.id?" active":"");b.textContent=`${set.name} (${set.question_count})`;b.onclick=()=>openSet(set.id);list.appendChild(b)})}
async function openSet(id){current=await api(`/api/game-sets/${id}`);render();loadSets()}
function newSet(){current={id:null,name:"",questions:[blankQuestion()]};render();message("Name the set and complete its first question before saving.")}
function render(){empty.classList.toggle("hidden",!!current);editor.classList.toggle("hidden",!current);if(!current)return;$("set-name").value=current.name;questions.innerHTML="";current.questions.forEach((q,i)=>questions.appendChild(questionCard(q,i)));$("duplicate-set").disabled=!current.id;$("delete-set").disabled=!current.id}
function input(label,value,onchange){const l=document.createElement("label");l.textContent=label;const e=document.createElement("input");e.value=value;e.maxLength=200;e.oninput=()=>onchange(e.value);l.appendChild(e);return l}
function pngData(canvas){const data=canvas.toDataURL("image/png");if(Math.ceil((data.length-data.indexOf(",")-1)*.75)>15*1024*1024)throw Error("This image is still too large after optimization.");return data}
async function prepareImage(file){if(!["image/png","image/jpeg","image/jpg","image/webp","image/gif","image/bmp"].includes(file.type))throw Error("Choose a common image format such as PNG, JPG, JPEG, WebP, GIF, or BMP.");const source=URL.createObjectURL(file);try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error("The selected image could not be opened."));image.src=source});const longest=Math.max(image.naturalWidth,image.naturalHeight),scale=Math.min(1,1920/longest),width=Math.max(1,Math.round(image.naturalWidth*scale)),height=Math.max(1,Math.round(image.naturalHeight*scale));const canvas=document.createElement("canvas");canvas.width=width;canvas.height=height;canvas.getContext("2d").drawImage(image,0,0,width,height);return pngData(canvas)}finally{URL.revokeObjectURL(source)}}
function fileInput(label,q,key,rerender){const l=document.createElement("label");l.textContent=label;const f=document.createElement("input");f.type="file";f.accept=".png,.jpg,.jpeg,.webp,.gif,.bmp,image/png,image/jpeg,image/webp,image/gif,image/bmp";f.onchange=async()=>{const file=f.files[0];if(!file)return;f.disabled=true;message(`Preparing ${file.name}…`);try{q[key]=await prepareImage(file);if(key==="image"&&q.use_same_image)q.reveal_image=q.image;rerender();message(`${file.name} is ready.`)}catch(error){message(error.message)}finally{f.disabled=false}};l.appendChild(f);if(q[key]){const ready=document.createElement("span");ready.className="hint";ready.textContent="Image selected and ready to save.";l.appendChild(ready)}return l}
function imagePreview(source,label){const box=document.createElement("div");box.className="stage";if(!source){box.innerHTML=`<p class="hint" style="color:white;padding:12px">Upload the ${label} image.</p>`;return box}const image=document.createElement("img");image.alt=`${label} preview`;image.src=source;image.onerror=()=>{box.innerHTML=`<p class="hint" style="color:white;padding:12px">The ${label} image could not be displayed. Choose it again.</p>`};box.appendChild(image);return box}
async function applyCrop(source,crop){const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error("The image could not be opened for cropping."));image.src=source});const sx=Math.round(crop.x*image.naturalWidth),sy=Math.round(crop.y*image.naturalHeight),sw=Math.max(1,Math.round(crop.w*image.naturalWidth)),sh=Math.max(1,Math.round(crop.h*image.naturalHeight));const scale=Math.min(1,1920/Math.max(sw,sh)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(sw*scale));canvas.height=Math.max(1,Math.round(sh*scale));canvas.getContext("2d").drawImage(image,sx,sy,sw,sh,0,0,canvas.width,canvas.height);return pngData(canvas)}
function cropEditor(q,key,clearsSolution){const wrap=document.createElement("div"),activeKey=`${key}_crop_active`,cropKey=`${key}_crop`,squareKey=`${key}_square_crop`;const toggle=document.createElement("button");toggle.type="button";toggle.className="ghost";toggle.textContent=q[activeKey]?"Close crop tool":"Crop image";toggle.disabled=!q[key];toggle.onclick=()=>{q[activeKey]=!q[activeKey];render()};wrap.appendChild(toggle);if(!q[key]||!q[activeKey])return wrap;const crop=q[cropKey]||{x:.1,y:.1,w:.8,h:.8};q[cropKey]=crop;const hint=document.createElement("p");hint.className="hint";hint.textContent="Drag the orange window to move it; drag its lower-right handle to resize it.";wrap.appendChild(hint);const stage=document.createElement("div"),image=document.createElement("img"),windowEl=document.createElement("div"),handle=document.createElement("div");stage.className="crop-stage";image.src=q[key];windowEl.className="crop-window";handle.className="crop-handle";windowEl.appendChild(handle);stage.append(image,windowEl);const draw=()=>{windowEl.style.left=`${crop.x*100}%`;windowEl.style.top=`${crop.y*100}%`;windowEl.style.width=`${crop.w*100}%`;windowEl.style.height=`${crop.h*100}%`};const fitSquare=()=>{const ratio=stage.clientWidth/stage.clientHeight||1;crop.h=Math.min(1-crop.y,crop.w*ratio);crop.w=Math.min(1-crop.x,crop.h/ratio)};image.onload=()=>{if(q[squareKey])fitSquare();draw()};draw();const square=document.createElement("label"),squareInput=document.createElement("input");squareInput.type="checkbox";squareInput.checked=Boolean(q[squareKey]);squareInput.onchange=()=>{q[squareKey]=squareInput.checked;if(q[squareKey])fitSquare();draw()};square.append(squareInput,document.createTextNode(" Lock crop to 1:1"));wrap.append(square,stage);if(key==="image"&&q.reveal_image){const shared=document.createElement("label"),sharedInput=document.createElement("input");sharedInput.type="checkbox";sharedInput.checked=Boolean(q.apply_crop_to_reveal);sharedInput.onchange=()=>q.apply_crop_to_reveal=sharedInput.checked;shared.append(sharedInput,document.createTextNode(" Also apply this crop to the reveal image"));wrap.appendChild(shared)}let mode,start;windowEl.onpointerdown=e=>{e.preventDefault();mode=e.target===handle?"resize":"move";const r=stage.getBoundingClientRect();start={x:e.clientX,y:e.clientY,cx:crop.x,cy:crop.y,cw:crop.w,ch:crop.h,w:r.width,h:r.height};windowEl.setPointerCapture(e.pointerId)};windowEl.onpointermove=e=>{if(!mode)return;const dx=(e.clientX-start.x)/start.w,dy=(e.clientY-start.y)/start.h;if(mode==="move"){crop.x=Math.max(0,Math.min(1-crop.w,start.cx+dx));crop.y=Math.max(0,Math.min(1-crop.h,start.cy+dy))}else if(q[squareKey]){crop.w=Math.max(.05,Math.min(1-crop.x,start.cw+dx));crop.h=Math.max(.05,Math.min(1-crop.y,crop.w*(start.w/start.h)));crop.w=Math.min(1-crop.x,crop.h/(start.w/start.h))}else{crop.w=Math.max(.05,Math.min(1-crop.x,start.cw+dx));crop.h=Math.max(.05,Math.min(1-crop.y,start.ch+dy))}draw()};windowEl.onpointerup=()=>mode=null;const apply=document.createElement("button");apply.type="button";apply.textContent="Apply crop";apply.onclick=async()=>{try{message("Applying crop…");if(key==="image"&&q.apply_crop_to_reveal&&q.reveal_image)q.reveal_image=await applyCrop(q.reveal_image,crop);q[key]=await applyCrop(q[key],crop);if(key==="image"&&q.use_same_image)q.reveal_image=q.image;delete q[cropKey];q[activeKey]=false;if(clearsSolution)q.solution=null;render();message(clearsSolution?"Crop applied. Place the solution circle again on the cropped image.":"Crop applied.")}catch(error){message(error.message)}};wrap.appendChild(apply);return wrap}
function questionCard(q,i){const card=document.createElement("article");card.className="question-card";const top=document.createElement("div");top.className="question-top";top.innerHTML=`<h2>Question ${i+1}</h2>`;const actions=document.createElement("div");[["↑",()=>move(i,-1)],["↓",()=>move(i,1)],["Remove",()=>{current.questions.splice(i,1);render()}]].forEach(([t,fn])=>{const b=document.createElement("button");b.className="ghost";b.textContent=t;b.onclick=fn;b.disabled=(t==="↑"&&i===0)||(t==="↓"&&i===current.questions.length-1);actions.appendChild(b)});top.appendChild(actions);card.appendChild(top);card.appendChild(input("Question text",q.question,v=>q.question=v));const type=document.createElement("label");type.textContent="Default round type";type.innerHTML+=`<select><option value="individual_blind">Individual round (blind)</option><option value="individual_seeing">Individual round (seeing)</option><option value="leader">Leader round</option></select>`;type.querySelector("select").value=q.default_type;type.querySelector("select").onchange=e=>q.default_type=e.target.value;card.appendChild(type);const duration=document.createElement("label"),durationInput=document.createElement("input");duration.textContent="Question time limit (seconds)";durationInput.type="number";durationInput.min="5";durationInput.max="600";durationInput.value=q.duration_seconds||60;durationInput.oninput=()=>q.duration_seconds=durationInput.value;duration.appendChild(durationInput);card.appendChild(duration);const crosshair=document.createElement("label");const crosshairInput=document.createElement("input");crosshairInput.type="checkbox";crosshairInput.checked=Boolean(q.show_crosshair);crosshairInput.onchange=()=>{q.show_crosshair=crosshairInput.checked;render()};crosshair.append(crosshairInput,document.createTextNode(" Show crosshair inside the solution circle while creating this question"));card.appendChild(crosshair);const sameImage=document.createElement("label"),sameImageInput=document.createElement("input");sameImageInput.type="checkbox";sameImageInput.checked=Boolean(q.use_same_image);sameImageInput.onchange=()=>{q.use_same_image=sameImageInput.checked;if(q.use_same_image&&q.image)q.reveal_image=q.image;render()};sameImage.append(sameImageInput,document.createTextNode(" Use question image as the reveal image"));card.appendChild(sameImage);const grid=document.createElement("div");grid.className="grid";const normal=document.createElement("div");normal.className="image-box";normal.appendChild(fileInput("Question image",q,"image",render));normal.appendChild(stage(q));normal.appendChild(cropEditor(q,"image",true));const reveal=document.createElement("div");reveal.className="image-box";reveal.appendChild(fileInput("Reveal image",q,"reveal_image",render));reveal.appendChild(imagePreview(q.reveal_image,"reveal"));reveal.appendChild(cropEditor(q,"reveal_image",false));grid.append(normal,reveal);card.appendChild(grid);return card}
function stage(q){const wrap=document.createElement("div"),box=document.createElement("div");box.className="stage";wrap.appendChild(box);if(!q.image){box.innerHTML='<p class="hint" style="color:white;padding:12px">Upload a question image, then click it to place the solution circle.</p>';return wrap}const img=document.createElement("img");img.src=q.image;box.appendChild(img);const circle=document.createElement("div");circle.className="circle"+(q.show_crosshair?" crosshair":"")+(q.solution?"":" hidden");box.appendChild(circle);const draw=()=>{if(!q.solution)return;circle.style.left=`${q.solution.x*100}%`;circle.style.top=`${q.solution.y*100}%`;circle.style.width=circle.style.height=`${q.solution.r*200}%`};draw();const place=e=>{const r=box.getBoundingClientRect();q.solution={...(q.solution||{}),x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)),r:(q.solution&&q.solution.r)||.06};circle.classList.remove("hidden");draw();renderRadius()};box.onclick=e=>{if(e.target!==circle)place(e)};circle.onpointerdown=e=>{e.preventDefault();e.stopPropagation();circle.setPointerCapture(e.pointerId);circle.onpointermove=ev=>{const r=box.getBoundingClientRect();q.solution.x=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));q.solution.y=Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height));draw()};circle.onpointerup=()=>{circle.onpointermove=null;circle.onpointerup=null}};const control=document.createElement("label");control.textContent="Solution circle size";const range=document.createElement("input");range.type="range";range.min="0.01";range.max="0.5";range.step="0.01";const renderRadius=()=>range.value=q.solution?q.solution.r:.06;renderRadius();range.oninput=()=>{if(!q.solution)q.solution={x:.5,y:.5,r:+range.value};else q.solution.r=+range.value;circle.classList.remove("hidden");draw()};const reset=document.createElement("button");reset.type="button";reset.className="ghost";reset.textContent="Reset to default (6%)";reset.onclick=()=>{if(!q.solution)q.solution={x:.5,y:.5,r:.06};else q.solution.r=.06;circle.classList.remove("hidden");draw();renderRadius()};control.append(range,reset);wrap.appendChild(control);return wrap}
function move(i,d){const to=i+d;if(to<0||to>=current.questions.length)return;[current.questions[i],current.questions[to]]=[current.questions[to],current.questions[i]];render()}
$("new-set").onclick=newSet;$("add-question").onclick=()=>{current.questions.push(blankQuestion());render()};$("set-name").oninput=e=>current.name=e.target.value;
$("save-set").onclick=async()=>{try{const url=current.id?`/api/game-sets/${current.id}`:"/api/game-sets";current=await api(url,{method:current.id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(current)});message("Game-set saved.");await loadSets();render()}catch(e){message(e.message)}};
$("duplicate-set").onclick=async()=>{try{current=await api(`/api/game-sets/${current.id}/duplicate`,{method:"POST"});message("Copy created. Rename it, then save.");await loadSets();render()}catch(e){message(e.message)}};
$("delete-set").onclick=async()=>{if(!confirm(`Delete “${current.name}” and all its images?`))return;try{await api(`/api/game-sets/${current.id}`,{method:"DELETE"});current=null;await loadSets();render()}catch(e){message(e.message)}};
loadSets().catch(e=>message(e.message));
</script></body></html>
